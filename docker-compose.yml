services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meravo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-meravo}
    volumes:
      - meravo_pgdata:/var/lib/postgresql/data
    # The database is deliberately NOT published to the host: the backend
    # reaches it over the internal compose network, and publishing it would
    # expose Postgres - on a server, to the whole internet - behind whatever
    # POSTGRES_PASSWORD happens to be set. To inspect it with a GUI, add:
    #   ports:
    #     - "${POSTGRES_PORT:-5432}:5432"
    # or run: docker compose exec db psql -U meravo -d meravo
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meravo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://meravo:change-me@db:5432/meravo}
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-long-random-string}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8090,http://127.0.0.1:8090}
      # Swagger/ReDoc publish a full map of the API - off unless asked for.
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      # Nothing in the storefront signs in; leave the auth routes unmounted.
      ENABLE_ACCOUNTS: ${ENABLE_ACCOUNTS:-false}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      PAYFAST_MODE: ${PAYFAST_MODE:-sandbox}
      PAYFAST_MERCHANT_ID: ${PAYFAST_MERCHANT_ID:-10000100}
      PAYFAST_MERCHANT_KEY: ${PAYFAST_MERCHANT_KEY:-46f0cd694581a}
      PAYFAST_PASSPHRASE: ${PAYFAST_PASSPHRASE:-}
      PAYFAST_RETURN_URL: ${PAYFAST_RETURN_URL:-http://localhost:8090/order-success}
      PAYFAST_CANCEL_URL: ${PAYFAST_CANCEL_URL:-http://localhost:8090/cart}
      PAYFAST_NOTIFY_URL: ${PAYFAST_NOTIFY_URL:-http://localhost:${BACKEND_PORT:-8000}/api/payments/payfast/notify}
      # Order notification email. Leave SMTP_HOST empty to disable sending.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-MERAVO}
      SHOP_OWNER_EMAIL: ${SHOP_OWNER_EMAIL:-Heinrichcdoman@gmail.com}
      SHOP_CONTACT_PHONE: ${SHOP_CONTACT_PHONE:-067 157 2670}
      STORE_URL: ${STORE_URL:-http://localhost:${FRONTEND_PORT:-8090}}
      # WhatsApp order confirmation. Empty WHATSAPP_PROVIDER disables it.
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-}
      WHATSAPP_COUNTRY_CODE: ${WHATSAPP_COUNTRY_CODE:-27}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-order_confirmation}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-en}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      TWILIO_CONTENT_SID: ${TWILIO_CONTENT_SID:-}
    # Bound to loopback: on a server this keeps the API off the public
    # internet, where it would otherwise answer on port 8000 bypassing
    # nginx's security headers entirely. Requests reach it through the
    # frontend's /api proxy, and Caddy talks to it over the compose network.
    # http://localhost:8000 still works on your own machine.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    depends_on:
      - backend
    # Also loopback-only. In production Caddy terminates HTTPS and reaches
    # this container over the compose network, so nothing needs to be
    # published to the outside world.
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8090}:80"

volumes:
  meravo_pgdata:
