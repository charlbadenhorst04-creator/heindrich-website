server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version in responses and error pages.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;

        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An API response is never cacheable here: carts and stock change.
        add_header Cache-Control "no-store" always;
    }

    # Vite fingerprints these filenames with a content hash, so a changed file
    # always arrives under a new name. Safe to cache hard and never revalidate.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Product photos keep a stable filename (car-vacuum-cleaner.png), so a
    # replaced photo reuses its URL. These must revalidate, otherwise
    # returning shoppers keep seeing the old picture long after it changed.
    location /images/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    location = /favicon.svg {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
    }

    # index.html names the current asset hashes, so it must never be served
    # from cache - a stale copy would point a returning visitor at asset
    # files that no longer exist after a rebuild.
    location / {
        try_files $uri $uri/ /index.html;

        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
