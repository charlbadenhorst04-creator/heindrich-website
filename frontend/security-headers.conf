# Shared security headers.
#
# nginx does not merge add_header from an outer block into an inner one: as
# soon as a location sets any add_header of its own (a Cache-Control, say),
# the server-level ones stop applying to it. Rather than repeat these in
# every location and risk them drifting apart, each location includes this
# file.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# form-action MUST keep the Payfast hosts: checkout works by POSTing a
# signed form to Payfast's hosted payment page, and dropping them here would
# block every payment.
# style-src needs 'unsafe-inline' because Framer Motion animates via inline
# styles; script-src deliberately does not.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self'; form-action 'self' https://www.payfast.co.za https://sandbox.payfast.co.za; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
